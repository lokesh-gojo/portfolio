<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-agri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f291e" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg-agri)"/>
  
  <rect x="30" y="30" width="540" height="300" rx="16" fill="#062f25" stroke="#059669" stroke-width="1.5"/>
  <circle cx="55" cy="55" r="5" fill="#ef4444"/>
  <circle cx="70" cy="55" r="5" fill="#f59e0b"/>
  <circle cx="85" cy="55" r="5" fill="#10b981"/>
  <text x="110" y="59" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">agri-ai // Soil Health &amp; Crop Decision Support</text>

  <!-- Trophy Badge -->
  <rect x="385" y="44" width="170" height="22" rx="11" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1"/>
  <text x="395" y="59" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🏆 2x Hackathon 1st Prize</text>

  <text x="50" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">🌾 Smart Crop Rotation AI</text>

  <!-- Metrics Grid -->
  <g transform="translate(50, 145)">
    <rect x="0" y="0" width="115" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="25" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">Nitrogen (N)</text>
    <text x="15" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">142 mg/kg</text>

    <rect x="125" y="0" width="115" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="140" y="25" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">Phosphorus (P)</text>
    <text x="140" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">48 mg/kg</text>

    <rect x="250" y="0" width="115" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="265" y="25" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">Potassium (K)</text>
    <text x="265" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">198 mg/kg</text>

    <rect x="375" y="0" width="125" height="60" rx="8" fill="#047857" stroke="#34d399" stroke-width="1"/>
    <text x="390" y="25" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Soil Health Score</text>
    <text x="390" y="48" fill="#fef08a" font-family="system-ui, sans-serif" font-size="18" font-weight="700">92% Optimal</text>
  </g>

  <!-- Advisory Chat Snippet -->
  <rect x="50" y="220" width="500" height="55" rx="10" fill="#022c22" stroke="#059669" stroke-width="1"/>
  <text x="65" y="244" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Gemini Agro-Bot (தமிழ் &amp; EN):</text>
  <text x="235" y="244" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">"Recommended Rotation: Legumes to replenish Nitrogen."</text>
  <text x="65" y="263" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11">Hardware: ESP32 IoT Soil Sensors · Multi-season yield profit maximization</text>

  <!-- Tech tags -->
  <g transform="translate(50, 290)">
    <rect x="0" y="0" width="75" height="24" rx="6" fill="#10b981" fill-opacity="0.3"/>
    <text x="14" y="16" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Python</text>

    <rect x="85" y="0" width="100" height="24" rx="6" fill="#3b82f6" fill-opacity="0.3"/>
    <text x="97" y="16" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Gemini API</text>

    <rect x="195" y="0" width="85" height="24" rx="6" fill="#f59e0b" fill-opacity="0.3"/>
    <text x="207" y="16" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ESP32 IoT</text>

    <rect x="290" y="0" width="85" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.3"/>
    <text x="302" y="16" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Analytics</text>

    <rect x="385" y="0" width="115" height="24" rx="6" fill="#ef4444" fill-opacity="0.3"/>
    <text x="397" y="16" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="600">HACKRO '26</text>

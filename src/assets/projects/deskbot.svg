<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-deskbot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" fill="url(#bg-deskbot)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.07">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Window Header -->
  <rect x="30" y="30" width="540" height="300" rx="16" fill="#151c2e" stroke="#2d3748" stroke-width="1.5"/>
  <circle cx="55" cy="55" r="5" fill="#ef4444"/>
  <circle cx="70" cy="55" r="5" fill="#f59e0b"/>
  <circle cx="85" cy="55" r="5" fill="#10b981"/>
  <text x="110" y="59" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">easa-deskbot-v2.3 // Production RAG Architecture</text>
  
  <!-- Status Badge -->
  <rect x="440" y="45" width="115" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
  <circle cx="452" cy="55" r="3.5" fill="#10b981"/>
  <text x="462" y="59" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Enterprise RAG</text>

  <!-- Main Hero Graphic in Window -->
  <text x="50" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">🎓 EASA DeskBot AI</text>
  <text x="50" y="128" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Strict Source-Grounded RAG · Fast API &amp; Supabase pgvector</text>

  <!-- Query / Answer Mock Cards -->
  <rect x="50" y="145" width="500" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="65" y="170" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">User (Tamil/English):</text>
  <text x="210" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">"What are the top B.E. courses, ECE intake, and hostels?"</text>
  <text x="65" y="192" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">✓ BM25 + Dense Hybrid Retrieval (384-dim) &amp; Context Rewriter</text>

  <rect x="50" y="215" width="500" height="60" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="65" y="240" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DeskBot Verified LLM:</text>
  <text x="205" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">"EASA Autonomous (Code 2755): Verified facts &amp; notices."</text>
  <text x="65" y="262" fill="#facc15" font-family="system-ui, sans-serif" font-size="11">Zero Hallucination Gate · 60 req/min Rate-Limiter · Dockerized</text>

  <!-- Tech tags -->
  <g transform="translate(50, 290)">
    <rect x="0" y="0" width="75" height="24" rx="6" fill="#3b82f6" fill-opacity="0.25"/>
    <text x="12" y="16" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">FastAPI</text>

    <rect x="85" y="0" width="85" height="24" rx="6" fill="#10b981" fill-opacity="0.25"/>
    <text x="97" y="16" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">pgvector</text>

    <rect x="180" y="0" width="95" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.25"/>
    <text x="192" y="16" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Gemini SDK</text>

    <rect x="285" y="0" width="80" height="24" rx="6" fill="#ec4899" fill-opacity="0.25"/>
    <text x="297" y="16" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Docker</text>

    <rect x="375" y="0" width="105" height="24" rx="6" fill="#f59e0b" fill-opacity="0.25"/>
    <text x="387" y="16" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cloud Run</text>
  </g>
</svg>

